<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desktop — janelas + agentes sobrepostos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gabriel-s/tokens.css">
<link rel="stylesheet" href="ds/gabriel-s/components/bundle.css">
<script src="ds/gabriel-s/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&amp;family=Geist+Mono:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7cf0d4}a:hover{color:#f4fbfb}
.eye-work{animation:eye-pulse 1.2s ease-in-out infinite}
@keyframes eye-pulse{0%,100%{opacity:1}50%{opacity:.2}}
.eye-idle{transform-box:fill-box;transform-origin:center;animation:eye-blink 4.5s infinite}
@keyframes eye-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye-done{opacity:.4}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.eye-work,.eye-idle,.spin{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); color: var(--text)">
<header aria-label="Barra do Omarchy" style="position: absolute; left: 0; top: 0; right: 0; height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: var(--bg); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); z-index: 2">
<div style="display: flex; align-items: center; gap: 12px; margin-left: 8px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Menu Omarchy" role="img"><path d="M4 4h16v16H4z"></path><path d="M9 9h6v6H9z"></path></svg>
<nav aria-label="Workspaces" style="display: flex; align-items: center">
<sc-for list="{{workspaces}}" as="w" hint-placeholder-count="5">
<span style="min-width: 9px; padding: 0 6px; margin: 0 1.5px; text-align: center; opacity: {{w.op}}">{{w.label}}</span>
</sc-for>
</nav>
</div>
<div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px">
<span>quarta-feira 22:50</span>
<span style="color: var(--muted)">[CLIMA]</span>
</div>
<div style="display: flex; align-items: center; gap: 15px; margin-right: 8px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Bandeja"><path d="M6 15l6-6 6 6"></path></svg>
<button type="button" onClick="{{toggleAgents}}" aria-label="{{agentsAria}}" aria-expanded="{{agentsVisible}}" style="position: relative; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: {{agentsBtnBg}}; border: 0; font: inherit; color: var(--text); cursor: pointer">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
<sc-for list="{{miniFace}}" as="c" hint-placeholder-count="49">
<circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" fill="{{c.fill}}"></circle>
</sc-for>
</svg>
<span>4</span>
<span style="display: inline-flex; align-items: center; gap: 3px; color: var(--caution)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" aria-hidden="true"><path d="M12 3L2 21h20zM12 10v5M12 18h.01"></path></svg>1</span>
<sc-if value="{{agentsVisible}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; background: var(--accent)"></span>
</sc-if>
</button>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Agentes do Omarchy: uso e limites"><path d="M5 8h14v11H5z"></path><path d="M12 4v4"></path><path d="M9.5 13h.01M14.5 13h.01"></path><path d="M2 12v3M22 12v3"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Bluetooth"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Rede"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5 13a10 10 0 0 1 14 0"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M12 20h.01"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Áudio"><path d="M11 5L6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Monitor"><path d="M3 4h18v12H3z"></path><path d="M8 20h8M12 16v4"></path></svg>
<svg width="16" height="14" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Energia"><path d="M2 7h18v10H2z"></path><path d="M23 10v4"></path><path d="M5 10h9v4H5z" fill="currentColor"></path></svg>
</div>
</header>
<div style="position: absolute; left: 10px; top: 36px; width: 945px; height: 1034px; box-sizing: border-box; border: 2px solid var(--accent); overflow: hidden">
<dc-import name="Terminal" w="941px" h="1030px" hint-size="941px,1030px"></dc-import>
</div>
<div style="position: absolute; left: 965px; top: 36px; width: 945px; height: 1034px; box-sizing: border-box; border: 2px solid var(--line-strong); overflow: hidden">
<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 20px; color: var(--text)">
<div style="flex-grow: 1; min-height: 0; display: flex">
<nav aria-label="Barra de atividades" style="flex: none; width: 44px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line)">
<div style="display: flex; flex-direction: column">
<sc-for list="{{activity}}" as="ic" hint-placeholder-count="5">
<span role="img" aria-label="{{ic.aria}}" style="position: relative; height: 44px; display: grid; place-items: center; color: {{ic.c}}">
<sc-if value="{{ic.on}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent)"></span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="{{ic.d}}"></path></svg>
<sc-if value="{{ic.badge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; right: 6px; bottom: 8px; min-width: 14px; height: 14px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 9px; line-height: 14px">{{ic.badge}}</span></sc-if>
</span>
</sc-for>
</div>
<span role="img" aria-label="Configurações" style="height: 44px; display: grid; place-items: center; color: var(--control)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1l2.1-2.1M17 7l2.1-2.1"></path></svg></span>
</nav>
<aside aria-label="Explorador" style="flex: none; width: 232px; display: flex; flex-direction: column; border-right: 1px solid var(--line)">
<div style="height: 35px; display: flex; align-items: center; padding: 0 16px; font-size: 11px; letter-spacing: 0.14em; color: var(--muted)">EXPLORADOR</div>
<div style="height: 22px; display: flex; align-items: center; padding: 0 12px; font-size: 11px; letter-spacing: 0.14em; color: var(--text-strong)">⌄ TCC</div>
<sc-for list="{{tree}}" as="f" hint-placeholder-count="9">
<div style="height: 22px; display: flex; align-items: center; gap: 6px; padding-left: {{f.pad}}; padding-right: 12px; background: {{f.bg}}; font-size: 12px; color: {{f.c}}">
<span style="width: 10px; color: var(--control)">{{f.chev}}</span>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{f.name}}</span>
<span style="color: {{f.gitC}}">{{f.git}}</span>
</div>
</sc-for>
</aside>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="flex: none; height: 35px; display: flex; align-items: stretch; border-bottom: 1px solid var(--line)">
<span style="display: flex; align-items: center; gap: 8px; padding: 0 14px; border-top: 2px solid var(--accent); border-right: 1px solid var(--line); color: var(--text-strong)">lstm.py <span style="color: var(--caution)">●</span></span>
<span style="display: flex; align-items: center; padding: 0 14px; border-top: 2px solid transparent; border-right: 1px solid var(--line); color: var(--muted)">train.py</span>
</div>
<div style="flex: none; height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 12px; color: var(--muted)">models <span style="color: var(--control)">›</span> lstm.py <span style="color: var(--control)">›</span> <span style="color: var(--accent)">LoadForecaster</span> <span style="color: var(--control)">›</span> <span style="color: var(--text-strong)">__init__</span></div>
<div style="flex-grow: 1; min-height: 0; padding: 4px 0; overflow: hidden; white-space: pre">
<sc-for list="{{code}}" as="ln" hint-placeholder-count="24">
<div style="height: 20px; display: flex; background: {{ln.rowBg}}">
<span style="width: 52px; text-align: right; padding-right: 10px; color: {{ln.lnC}}">{{ln.n}}</span>
<span aria-hidden="true" style="width: 2px; margin-right: 16px; background: {{ln.signC}}"></span>
<span><sc-for list="{{ln.segs}}" as="s" hint-placeholder-count="5"><span style="color: {{s.c}}">{{s.t}}</span></sc-for><sc-if value="{{ln.cur}}" hint-placeholder-val="{{false}}"><span style="background: var(--accent); color: var(--on-accent)"> </span></sc-if></span>
</div>
</sc-for>
</div>
</div>
</div>
<div style="flex: none; height: 22px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted)">
<div style="display: flex; align-items: stretch; height: 100%">
<span style="display: flex; align-items: center; padding: 0 10px; background: var(--accent); color: var(--on-accent)">⎇</span>
<span style="display: flex; align-items: center; padding: 0 10px; color: var(--data-4)">main*</span>
<span style="display: flex; align-items: center; gap: 10px; padding: 0 10px"><span>✕ 0</span><span>▲ 0</span></span>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 0 12px">
<span style="color: var(--text)">Ln 11, Col 24</span><span>Espaços: 4</span><span>UTF-8</span><span>LF</span><span>Python</span>
</div>
</div>
</div>
</div>
<sc-if value="{{agentsVisible}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleAgents}}" aria-label="Fechar painel de agentes" style="position: absolute; inset: 26px 0 0 0; padding: 0; background: transparent; border: 0; cursor: default; z-index: 3"></button>
<div style="position: absolute; right: 10px; top: 32px; z-index: 4">
<dc-import name="AgentesWidget" side="right" hint-size="580px,520px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agentesVisivel":{"editor":"boolean","default":true,"section":"Agentes"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { agentsVisible: props.agentesVisivel ?? true };
}
componentDidUpdate(prev) {
if (prev.agentesVisivel !== this.props.agentesVisivel) this.setState({ agentsVisible: !!this.props.agentesVisivel });
}
renderVals() {
const workspaces = [1, 2, 3, 4, 5].map((k) => ({ label: k === 1 ? '■' : String(k), op: k <= 2 ? 1 : 0.5 }));
const FACE = ['.XXXXX.', 'X.....X', 'X.X.X.X', 'X.....X', 'X.XXX.X', 'X.....X', '.XXXXX.'];
const miniFace = [];
FACE.forEach((row, y) => row.split('').forEach((ch, x) => { if (ch !== '.') miniFace.push({ x: x * 2 + 1, y: y * 2 + 1, r: 0.85, fill: 'var(--data-1)' }); }));
const CODE = [
'import torch',
'from torch import nn',
'',
'',
'class LoadForecaster(nn.Module):',
'    """Prevê a carga de CPU dos próximos passos."""',
'',
'    def __init__(self, n_features: int, horizon: int = 12):',
'        super().__init__()',
'        self.hidden_size = 256',
'        self.dropout = 0.2',
'        self.lstm = nn.LSTM(',
'            input_size=n_features,',
'            hidden_size=self.hidden_size,',
'            num_layers=2,',
'            dropout=self.dropout,',
'            batch_first=True,',
'        )',
'        self.head = nn.Linear(self.hidden_size, horizon)',
'',
'    def forward(self, x: torch.Tensor) -> torch.Tensor:',
'        out, _ = self.lstm(x)',
'        # usa só o último passo da sequência',
'        return self.head(out[:, -1, :])'
];
const KW = new Set(['import', 'from', 'class', 'def', 'return', 'self', 'True', 'False', 'None', 'int']);
const tok = (line) => {
const out = [];
const re = /("""[^"]*"""|#.*$|"[^"]*"|'[^']*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|\s+|.)/g;
let m;
while ((m = re.exec(line))) {
const t = m[0];
let c = 'var(--text)';
if (t.startsWith('#')) c = 'var(--muted)';
else if (t.startsWith('"') || t.startsWith("'")) c = 'var(--data-3)';
else if (/^\d/.test(t)) c = 'var(--data-2)';
else if (KW.has(t)) c = 'var(--data-4)';
else if (/^[A-Z]/.test(t)) c = 'var(--accent)';
else if (line.slice(m.index + t.length).startsWith('(') && /^[a-z_]/.test(t)) c = 'var(--text-strong)';
out.push({ t, c });
}
return out;
};
const signs = { 9: { s: '~', c: 'var(--caution)' }, 10: { s: '+', c: 'var(--accent)' } };
const code = CODE.map((l, i) => ({ n: String(i + 1).padStart(3, ' '), segs: tok(l), sign: signs[i] ? signs[i].s : ' ', signC: signs[i] ? signs[i].c : 'transparent', cur: i === 10, lnC: i === 10 ? 'var(--text-strong)' : 'var(--control)' }));
const TREE = [
{ name: 'data', d: 0, dir: true, open: true },
{ name: 'raw', d: 1, dir: true, git: '', ign: true },
{ name: 'models', d: 0, dir: true, open: true, git: '●', gitC: 'var(--caution)' },
{ name: '__init__.py', d: 1 },
{ name: 'lstm.py', d: 1, git: 'M', gitC: 'var(--caution)', sel: true },
{ name: 'notebooks', d: 0, dir: true, open: true, git: '●', gitC: 'var(--accent)' },
{ name: 'eda.ipynb', d: 1, git: 'A', gitC: 'var(--accent)' },
{ name: 'forecast.yaml', d: 0 },
{ name: 'train.py', d: 0 },
{ name: 'README.md', d: 0 }
];
const tree = TREE.map((f) => ({
name: f.name,
pad: (12 + f.d * 14) + 'px',
chev: f.dir ? (f.open ? '⌄' : '›') : '',
git: f.git || '', gitC: f.gitC || 'transparent',
bg: f.sel ? 'var(--accent-subtle)' : 'transparent',
c: f.sel ? 'var(--text-strong)' : (f.ign ? 'var(--control)' : (f.git === 'M' ? 'var(--caution)' : (f.git === 'A' ? 'var(--accent)' : 'var(--text)')))
}));
const activity = [
{ aria: 'Explorador', d: 'M14 3H6v18h12V7zM14 3v4h4', on: true },
{ aria: 'Buscar', d: 'M10.5 3a7.5 7.5 0 1 0 0 15a7.5 7.5 0 1 0 0-15M16 16l5 5' },
{ aria: 'Controle de código, 2 alterações', d: 'M6 3v12M18 9a3 3 0 1 0 0-6a3 3 0 1 0 0 6M6 21a3 3 0 1 0 0-6a3 3 0 1 0 0 6M18 9a9 9 0 0 1-9 9', badge: '2' },
{ aria: 'Executar e depurar', d: 'M7 4l12 8-12 8z' },
{ aria: 'Extensões', d: 'M4 4h7v7H4zM13 13h7v7h-7zM4 13h7v7H4zM15 3l5 5-5 5-5-5z' }
].map((a) => ({ ...a, c: a.on ? 'var(--text-strong)' : 'var(--control)', badge: a.badge || '' , on: !!a.on }));
const v = this.state.agentsVisible;
return {
workspaces, miniFace, tree, activity,
code: code.map((l) => ({ ...l, n: String(Number(l.n)), rowBg: l.cur ? 'var(--surface)' : 'transparent', signC: l.sign === ' ' ? 'transparent' : l.signC })),
agentsVisible: v,
agentsBtnBg: v ? 'var(--inset)' : 'transparent',
agentsAria: 'Agentes: 4, 1 bloqueado. ' + (v ? 'Fechar painel' : 'Abrir painel'),
toggleAgents: () => this.setState({ agentsVisible: !this.state.agentsVisible })
};
}
}
</script>
</body>
</html>
