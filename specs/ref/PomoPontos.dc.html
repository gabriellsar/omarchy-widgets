<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pomodoro — Anel de pontos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gabriel-s/tokens.css">
<link rel="stylesheet" href="ds/gabriel-s/components/bundle.css">
<script src="ds/gabriel-s/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7cf0d4}a:hover{color:#f4fbfb}
</style>
</helmet>
<div style="width: 560px; height: 400px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; font-family: var(--font-sans); color: var(--text)">
<section aria-label="Pomodoro" style="position: relative; width: 336px; box-sizing: border-box; padding: 24px; background: var(--surface); border: 1px solid var(--line-strong); display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="position: absolute; left: -1px; top: -1px; width: 12px; height: 12px; border-left: 2px solid var(--accent); border-top: 2px solid var(--accent)"></span>
<div style="display: flex; justify-content: space-between; align-items: center">
<p class="gs-label">0x02 · Foco</p>
<x-import component-from-global-scope="GS.Tag" tone="accent">Sessão 2/4</x-import>
</div>
<div style="position: relative; width: 176px; height: 176px; align-self: center">
<svg width="176" height="176" viewBox="0 0 176 176" role="img" aria-label="7 de 25 minutos concluídos">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="25">
<circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="{{d.fill}}"></circle>
</sc-for>
<circle cx="{{cur.x}}" cy="{{cur.y}}" r="7" fill="none" stroke="var(--accent)" stroke-width="1"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span style="font-family: var(--font-mono); font-size: 40px; line-height: 44px; letter-spacing: -0.02em; color: var(--text-strong); font-variant-numeric: tabular-nums">18:20</span>
<span style="font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.14em; color: var(--muted)">RESTANTE</span>
</div>
</div>
<button type="button" aria-label="Escolher playlist do Spotify" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; background: var(--inset); border: 1px solid var(--control); color: var(--text); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="color: var(--accent)"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
<span style="flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">[PLAYLIST]</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div style="display: flex; justify-content: center; gap: 12px">
<x-import component-from-global-scope="GS.Button" variant="ghost" aria-label="Faixa anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M19 20L9 12l10-8z"></path><path d="M5 19V5"></path></svg></x-import>
<x-import component-from-global-scope="GS.Button" variant="primary" aria-label="Pausar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M7 4h3v16H7z"></path><path d="M14 4h3v16h-3z"></path></svg></x-import>
<x-import component-from-global-scope="GS.Button" variant="ghost" aria-label="Próxima faixa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M5 4l10 8-10 8z"></path><path d="M19 5v14"></path></svg></x-import>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"elapsed":{"editor":"int","default":7,"min":0,"max":25,"section":"Estado"},"$preview":{"width":560,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const n = 25, R = 78, C = 88;
const done = this.props.elapsed ?? 7;
const pt = (i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return { x: C + R * Math.cos(a), y: C + R * Math.sin(a) }; };
const dots = [];
for (let i = 0; i < n; i++) {
const p = pt(i);
dots.push({ x: p.x, y: p.y, r: i === done ? 4 : 3, fill: i < done ? 'var(--accent)' : (i === done ? 'var(--text-strong)' : 'var(--line-strong)') });
}
return { dots, cur: pt(Math.min(done, n - 1)) };
}
}
</script>
</body>
</html>
