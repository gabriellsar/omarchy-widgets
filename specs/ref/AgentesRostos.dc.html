<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agentes — rostos e cores</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gabriel-s/tokens.css">
<link rel="stylesheet" href="ds/gabriel-s/components/bundle.css">
<script src="ds/gabriel-s/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7cf0d4}a:hover{color:#f4fbfb}
.eye-work{animation:eye-pulse 1.2s ease-in-out infinite}
@keyframes eye-pulse{0%,100%{opacity:1}50%{opacity:.2}}
.eye-idle{transform-box:fill-box;transform-origin:center;animation:eye-blink 4.5s infinite}
@keyframes eye-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye-done{opacity:.4}
@media (prefers-reduced-motion: reduce){.eye-work,.eye-idle{animation:none}}
</style>
</helmet>
<div style="width: 560px; height: 560px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: var(--bg); font-family: var(--font-sans); color: var(--text)">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p class="gs-label">FIG.03 — Rostos 7×7</p>
<p style="margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.14em; color: var(--muted)">4 ROSTOS × DATA-1…4</p>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{grid}}" as="row" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 96px repeat(4, minmax(0, 1fr)); align-items: center; height: 64px; border-bottom: 1px solid var(--line)">
<span style="font-family: var(--font-mono); font-size: 12px; line-height: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-strong)">{{row.title}}</span>
<sc-for list="{{row.items}}" as="it" hint-placeholder-count="4">
<svg width="42" height="42" viewBox="0 0 42 42" role="img" aria-label="{{it.aria}}">
<sc-for list="{{it.cells}}" as="c" hint-placeholder-count="49">
<circle class="{{c.cls}}" cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" fill="{{c.fill}}"></circle>
</sc-for>
</svg>
</sc-for>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<p class="gs-label">Estados · olhos animados</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px">
<span style="width: 50px; height: 50px; box-sizing: border-box; display: grid; place-items: center; border: 1px solid {{s.ring}}">
<svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
<sc-for list="{{s.cells}}" as="c" hint-placeholder-count="49">
<circle class="{{c.cls}}" cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" fill="{{c.fill}}"></circle>
</sc-for>
</svg>
</span>
<x-import component-from-global-scope="GS.Tag" tone="{{s.tone}}" dot="{{s.dot}}">{{s.label}}</x-import>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const FACES = {
bolha: ['.XXXXX.', 'X.....X', 'X.E.E.X', 'X.....X', 'X.XXX.X', 'X.....X', '.XXXXX.'],
visor: ['...X...', 'XXXXXXX', 'X.....X', 'X.EEE.X', 'X.....X', 'X.....X', 'XXXXXXX'],
orelha: ['X.....X', 'XX...XX', 'X.....X', 'X.E.E.X', 'X.....X', 'X.X.X.X', '.XXXXX.'],
ciclope: ['.XXXXX.', 'X.....X', 'X.EEE.X', 'X.E.E.X', 'X.EEE.X', 'X.....X', '.XXXXX.']
};
const TINTS = ['var(--data-1)', 'var(--data-2)', 'var(--data-3)', 'var(--data-4)'];
const cellsFor = (face, tint, eyeCls) => {
const out = [];
FACES[face].forEach((row, y) => row.split('').forEach((ch, x) => {
const on = ch !== '.';
out.push({ x: x * 6 + 3, y: y * 6 + 3, r: on ? 2.5 : 1.2, fill: on ? tint : 'var(--line-strong)', cls: ch === 'E' ? eyeCls : '' });
}));
return out;
};
const grid = Object.keys(FACES).map((f) => ({
title: f,
items: TINTS.map((t, k) => ({ aria: 'Rosto ' + f + ', cor ' + (k + 1), cells: cellsFor(f, t, '') }))
}));
const states = [
{ label: 'Trabalhando', tone: 'accent', dot: true, eye: 'eye-work', ring: 'var(--line)' },
{ label: 'Bloqueado', tone: 'caution', dot: true, eye: '', ring: 'var(--caution)' },
{ label: 'Pronto', tone: 'neutral', dot: true, eye: 'eye-done', ring: 'var(--line)' },
{ label: 'Ocioso', tone: 'neutral', dot: false, eye: 'eye-idle', ring: 'var(--line)' }
].map((s) => ({ ...s, cells: cellsFor('bolha', 'var(--data-1)', s.eye) }));
return { grid, states };
}
}
</script>
</body>
</html>
