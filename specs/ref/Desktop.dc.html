<style>
body{margin:0}
a{color:#7cf0d4}a:hover{color:#f4fbfb}
.hm{animation:hm-flow 12s linear infinite}
@keyframes hm-flow{0%{opacity:.6}10%{opacity:.09}90%{opacity:.09}100%{opacity:.6}}
.eye-work{animation:eye-pulse 1.2s ease-in-out infinite}
@keyframes eye-pulse{0%,100%{opacity:1}50%{opacity:.2}}
.eye-idle{transform-box:fill-box;transform-origin:center;animation:eye-blink 4.5s infinite}
@keyframes eye-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye-done{opacity:.4}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.hm,.eye-work,.eye-idle,.spin{animation:none}}
</style>
</helmet>

<p style="margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.14em; color: var(--muted)">FIG.02 — POSIÇÕES ABERTAS · QUANTFURY MCP</p>

<span aria-hidden="true" style="position: absolute; left: -1px; top: -1px; width: 12px; height: 12px; border-left: 2px solid var(--accent); border-top: 2px solid var(--accent)"></span>

<div style="position: relative; width: 176px; height: 176px; align-self: center">
<svg width="176" height="176" viewBox="0 0 176 176" role="img" aria-label="7 de 25 minutos concluídos">
<sc-for list="{{ring}}" as="d" hint-placeholder-count="25">
<circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="{{d.fill}}"></circle>

<span style="font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.14em; color: var(--muted)">RESTANTE</span>
</div>
</div>
<button type="button" aria-label="Escolher playlist do Spotify" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; background: var(--inset); border: 1px solid var(--control); color: var(--text); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="color: var(--accent)"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>

</button>
<div style="display: flex; justify-content: center; gap: 12px">
<x-import component-from-global-scope="GS.Button" variant="ghost" aria-label="Faixa anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M19 20L9 12l10-8z"></path><path d="M5 19V5"></path></svg></x-import>
<x-import component-from-global-scope="GS.Button" variant="primary" aria-label="Pausar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M7 4h3v16H7z"></path><path d="M14 4h3v16h-3z"></path></svg></x-import>
<x-import component-from-global-scope="GS.Button" variant="ghost" aria-label="Próxima faixa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M5 4l10 8-10 8z"></path><path d="M19 5v14"></path></svg></x-import>
</div>
</section>

<div style="position: absolute; right: 48px; top: 74px">
<dc-import name="AgentesWidget" side="right" collapsed="{{agentsClosed}}" hint-size="580px,520px"></dc-import>
</div>

<nav aria-label="Dock" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line-strong)">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
<button type="button" aria-label="{{a.aria}}" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: transparent; border: 0; color: {{a.color}}; cursor: pointer">

<sc-if value="{{a.active}}" hint-placeholder-val="{{false}}">

<sc-if value="{{a.running}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted)"></span>
</sc-if>
</button>
</sc-for>
<span aria-hidden="true" style="width: 1px; height: 28px; margin: 0 6px; background: var(--line-strong)"></span>
<button type="button" aria-label="Adicionar app à dock" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: transparent; border: 1px dashed var(--control); color: var(--muted); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agentesFechado":{"editor":"boolean","default":false,"section":"Agentes"},"seed":{"editor":"int","default":42,"min":1,"max":999,"section":"Fundo"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const seed = this.props.seed ?? 42;
let s = seed * 9301 + 49297;
const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
const p = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
const GAP = 28, TOP = 26 + 14, LEVELS = 7, DUR = 12;
const COLS = Math.floor(1920 / GAP), ROWS = Math.floor((1080 - TOP) / GAP) + 1;
const field = (x, y) => {
const v = 0.45 * Math.sin(x * 0.0042 + p[0]) * Math.cos(y * 0.0051 + p[1])
+ 0.35 * Math.sin((x + y) * 0.0027 + p[2])
+ 0.2 * Math.cos(x * 0.0093 - y * 0.0068 + p[3]);
return (v + 1) / 2;
};
const dots = [];
let best = null;
for (let j = 0; j < ROWS; j++) {
for (let i = 0; i < COLS; i++) {
const x = GAP / 2 + i * GAP + (j % 2 ? GAP / 2 : 0);
const y = TOP + j * GAP;
if (x > 1920) continue;
const v = field(x, y);
const ph = (v * LEVELS) % 1;
dots.push({
x: x.toFixed(1), y,
r: (1.1 + 1.0 * v).toFixed(2),
o: ph < 0.1 || ph > 0.9 ? 0.55 : 0.09,
delay: (-(ph * DUR)).toFixed(2) + 's'
});
if (x > 600 && x < 1400 && y > 200 && y < 900 && (!best || v > best.v)) best = { x, y, v, i, j };
}
}
const peak = { x: best.x, y: best.y, ly: best.y - 10, y2: best.y - 36, tx: best.x + 8, ty: best.y - 40, label: 'PICO · X ' + best.i + ' · Y ' + best.j };
const FACES = {
bolha: ['.XXXXX.', 'X.....X', 'X.E.E.X', 'X.....X', 'X.XXX.X', 'X.....X', '.XXXXX.'],
visor: ['...X...', 'XXXXXXX', 'X.....X', 'X.EEE.X', 'X.....X', 'X.....X', 'XXXXXXX'],
orelha: ['X.....X', 'XX...XX', 'X.....X', 'X.E.E.X', 'X.....X', 'X.X.X.X', '.XXXXX.'],
ciclope: ['.XXXXX.', 'X.....X', 'X.EEE.X', 'X.E.E.X', 'X.EEE.X', 'X.....X', '.XXXXX.']
};
const ST = {
working: { label: 'Trabalhando', tone: 'accent', dot: true, eye: 'eye-work' },
blocked: { label: 'Bloqueado', tone: 'caution', dot: true, eye: '' },
done: { label: 'Pronto', tone: 'neutral', dot: true, eye: 'eye-done' },
idle: { label: 'Ocioso', tone: 'neutral', dot: false, eye: 'eye-idle' }
};
const cellsFor = (face, tint, eyeCls) => {
const out = [];
FACES[face].forEach((row, y) => row.split('').forEach((ch, x) => {
const on = ch !== '.';
out.push({ x: x * 4 + 2, y: y * 4 + 2, r: on ? 1.7 : 0.9, fill: on ? tint : 'var(--line-strong)', cls: ch === 'E' ? eyeCls : '' });
}));
return out;
};
const agents = [
{ label: 'api-refactor', sub: '~/easyfin · claude', face: 'bolha', tint: 'var(--data-1)', st: 'working' },
{ label: 'tcc-forecast', sub: '~/tcc · claude', face: 'visor', tint: 'var(--data-2)', st: 'blocked' },
{ label: 'portfolio', sub: '~/portfolio · codex', face: 'orelha', tint: 'var(--data-4)', st: 'done' },
{ label: 'shader-lab', sub: '~/quattro · claude', face: 'ciclope', tint: 'var(--data-3)', st: 'idle' }
].map((a, i) => {
const s = ST[a.st];
return { ...a, aria: a.label + ', ' + s.label, stateLabel: s.label, tone: s.tone, dot: s.dot, cells: cellsFor(a.face, a.tint, s.eye), ring: a.st === 'blocked' ? 'var(--caution)' : 'var(--line)', rowBg: i === 1 ? 'var(--inset)' : 'transparent' };
});
const pdf = (z) => Math.exp(-z * z / 2);
const BX = (z) => ((z + 3.5) / 7) * 72;
const BY = (z) => 24 - pdf(z) * 20;
let bell = '';
for (let k = 0; k <= 42; k++) { const z = -3.5 + k * 7 / 42; bell += (k ? 'L' : 'M') + BX(z).toFixed(1) + ' ' + BY(z).toFixed(1) + ' '; }
const pos = [{ ticker: 'BTC', side: 'LONG', z: 0.6 }, { ticker: 'NVDA', side: 'LONG', z: 2.4 }, { ticker: 'ETH', side: 'SHORT', z: -0.8 }];
const rows = pos.map((q) => { const alert = Math.abs(q.z) > 2; return { ...q, alert, mx: BX(q.z), my: BY(q.z), dot: alert ? 'var(--signal)' : 'var(--text-strong)' }; });
const n = 25, done = 7;
const pt = (k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / n; return { x: 88 + 78 * Math.cos(a), y: 88 + 78 * Math.sin(a) }; };
const ring = [];
for (let k = 0; k < n; k++) { const q = pt(k); ring.push({ x: q.x, y: q.y, r: k === done ? 4 : 3, fill: k < done ? 'var(--accent)' : (k === done ? 'var(--text-strong)' : 'var(--line-strong)') }); }
const FACE = ['.XXXXX.', 'X.....X', 'X.X.X.X', 'X.....X', 'X.XXX.X', 'X.....X', '.XXXXX.'];
const miniFace = [];
FACE.forEach((row, y) => row.split('').forEach((ch, x) => { if (ch !== '.') miniFace.push({ x: x * 2 + 1, y: y * 2 + 1, r: 0.85, fill: 'var(--data-1)' }); }));
const appList = [
{ name: 'Ghostty', d: 'M4 17l6-5-6-5M12 19h8', st: 'active' },
{ name: 'VS Code', d: 'M16 18l6-6-6-6M8 6l-6 6 6 6', st: '' },
{ name: 'Chrome', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.6-3.8 9s1.3 6.5 3.8 9', st: 'running' },
{ name: 'Yazi', d: 'M3 6h6l2 2h10v11H3z', st: '' },
{ name: 'Spotify', d: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0M21 16a3 3 0 1 1-6 0a3 3 0 1 1 6 0', st: 'running' },
{ name: 'Godot', d: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5', st: '' },
{ name: 'btop', d: 'M22 12h-4l-3 9L9 3l-3 9H2', st: '' }
];
return {
