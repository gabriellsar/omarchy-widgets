<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dock — Régua</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gabriel-s/tokens.css">
<link rel="stylesheet" href="ds/gabriel-s/components/bundle.css">
<script src="ds/gabriel-s/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7cf0d4}a:hover{color:#f4fbfb}
</style>
</helmet>
<div style="position: relative; width: 560px; height: 400px; box-sizing: border-box; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; font-family: var(--font-sans); color: var(--text)">
<nav aria-label="Dock" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line-strong)">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
<div style="position: relative">
<sc-if value="{{a.tip}}" hint-placeholder-val="{{false}}">
<span role="tooltip" style="position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); padding: 6px 10px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line-strong); font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.14em; color: var(--text-strong)">{{a.name}} <span style="color: var(--muted)">· SUPER {{a.key}}</span></span>
</sc-if>
<button type="button" aria-label="{{a.aria}}" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: {{a.bg}}; border: 0; color: {{a.color}}; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="{{a.d}}"></path></svg>
<sc-if value="{{a.active}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--accent)"></span>
</sc-if>
<sc-if value="{{a.idleRunning}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted)"></span>
</sc-if>
</button>
</div>
</sc-for>
<span aria-hidden="true" style="width: 1px; height: 28px; margin: 0 6px; background: var(--line-strong)"></span>
<button type="button" aria-label="Adicionar app à dock" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: transparent; border: 1px dashed var(--control); color: var(--muted); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const list = [
{ name: 'GHOSTTY', d: 'M4 17l6-5-6-5M12 19h8', state: 'active', key: '↵' },
{ name: 'VS CODE', d: 'M16 18l6-6-6-6M8 6l-6 6 6 6', state: 'hover', key: '⇧ N' },
{ name: 'CHROME', key: '⇧ B', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.6-3.8 9s1.3 6.5 3.8 9', state: 'running' },
{ name: 'YAZI', d: 'M3 6h6l2 2h10v11H3z', state: '', key: '⇧ F' },
{ name: 'SPOTIFY', d: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0M21 16a3 3 0 1 1-6 0a3 3 0 1 1 6 0', state: 'running', key: '⇧ M' },
{ name: 'GODOT', d: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5', state: '' },
{ name: 'BTOP', d: 'M22 12h-4l-3 9L9 3l-3 9H2', state: '' }
];
return {
apps: list.map((a, i) => ({
...a,
key: a.key || '',
aria: a.name === 'VS CODE' ? 'VS Code' : a.name.charAt(0) + a.name.slice(1).toLowerCase(),
active: a.state === 'active',
tip: a.state === 'hover',
idleRunning: a.state === 'running',
bg: a.state === 'hover' ? 'var(--inset)' : 'transparent',
color: a.state === 'active' || a.state === 'hover' ? 'var(--text-strong)' : 'var(--muted)'
}))
};
}
}
</script>
</body>
</html>
